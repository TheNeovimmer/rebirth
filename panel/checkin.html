<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Check-in - Rebirth</title>
  <link rel="icon" href="../logo.png">
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar">
      <div class="app-sidebar-header">
        <img src="../logo.png" alt="R"><span>Rebirth</span>
      </div>
      <nav class="app-sidebar-nav">
        <div class="app-sidebar-section">Main</div>
        <a href="dashboard.html" class="app-sidebar-link"><i class="fa-regular fa-house"></i>Dashboard</a>
        <a href="checkin.html" class="app-sidebar-link active"><i class="fa-regular fa-face-smile"></i>Daily Check-in</a>
        <a href="journal.html" class="app-sidebar-link"><i class="fa-regular fa-book"></i>Journal</a>
        <a href="appointments.html" class="app-sidebar-link"><i class="fa-regular fa-calendar"></i>Appointments</a>
        <a href="community.html" class="app-sidebar-link"><i class="fa-regular fa-comments"></i>Community</a>
        <a href="resources.html" class="app-sidebar-link"><i class="fa-regular fa-file-lines"></i>Resources</a>
        <div class="app-sidebar-section">Account</div>
        <a href="progress.html" class="app-sidebar-link"><i class="fa-regular fa-chart-line"></i>Progress</a>
        <a href="settings.html" class="app-sidebar-link"><i class="fa-regular fa-gear"></i>Settings</a>
      </nav>
      <div class="app-sidebar-footer">
        <div class="app-sidebar-user">
          <div class="app-sidebar-user-avatar">JD</div>
          <div><div class="app-sidebar-user-name">Jamie Doe</div><div class="app-sidebar-user-role">Member</div></div>
        </div>
      </div>
    </aside>

    <div class="app-main" style="flex:1;display:flex;flex-direction:column;min-width:0;">
      <header class="app-topbar">
        <div class="app-topbar-left">
          <span class="app-topbar-title">Daily Check-in</span>
        </div>
        <div class="app-topbar-right">
          <button class="app-topbar-btn"><i class="fa-regular fa-bell"></i><span class="dot"></span></button>
          <div class="app-topbar-avatar">JD</div>
        </div>
      </header>

      <div class="app-content">
        <div class="card">
          <div class="card-header"><h3>How are you feeling?</h3></div>
          <div class="card-body">
            <div class="mood-grid">
              <button class="mood-btn"><span class="mood-emoji">😡</span>Terrible</button>
              <button class="mood-btn"><span class="mood-emoji">😢</span>Low</button>
              <button class="mood-btn"><span class="mood-emoji">😐</span>Okay</button>
              <button class="mood-btn"><span class="mood-emoji">🙂</span>Good</button>
              <button class="mood-btn selected"><span class="mood-emoji">😊</span>Great</button>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><h3>Craving Level</h3></div>
          <div class="card-body">
            <input type="range" class="craving-slider" min="0" max="10" value="3">
            <div class="craving-labels"><span>None</span><span>Strong</span></div>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><h3>Journal Note</h3></div>
          <div class="card-body">
            <textarea class="form-input" rows="3" placeholder="How was your day?" style="resize:none;"></textarea>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><h3>Today's Checklist</h3></div>
          <div class="card-body">
            <label class="checkin-item done"><input type="checkbox" checked> Completed morning check-in</label>
            <label class="checkin-item done"><input type="checkbox" checked> Attended support group</label>
            <label class="checkin-item done"><input type="checkbox" checked> Practiced mindfulness</label>
            <label class="checkin-item"><input type="checkbox"> Reached out to a friend</label>
            <label class="checkin-item"><input type="checkbox"> Tracked my meals</label>
          </div>
        </div>

        <button class="btn btn-primary btn-block" style="margin-top:4px;">Save Check-in</button>
      </div>
    </div>

    <nav class="app-tabs">
      <a href="dashboard.html" class="app-tab"><i class="fa-regular fa-house"></i><span>Home</span></a>
      <a href="checkin.html" class="app-tab active"><i class="fa-regular fa-face-smile"></i><span>Check-in</span></a>
      <a href="community.html" class="app-tab"><i class="fa-regular fa-comments"></i><span>Community</span></a>
      <a href="progress.html" class="app-tab"><i class="fa-regular fa-chart-line"></i><span>Progress</span></a>
      <a href="journal.html" class="app-tab"><i class="fa-regular fa-bars"></i><span>More</span></a>
    </nav>
  </div>
</body>
</html>
