<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Rebirth</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><img src="logo.png" alt="Rebirth"></div>
    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-subtitle">Sign in to continue your journey</p>
    <form onsubmit="event.preventDefault(); window.location.href='panel/dashboard.html';">
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" id="email" type="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" id="password" type="password" placeholder="Enter your password" required>
      </div>
      <div class="form-row">
        <label class="form-checkbox">
          <input type="checkbox" checked> Remember me
        </label>
        <a href="#" class="form-link">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>
    <div class="auth-divider">or continue with</div>
    <button class="btn btn-outline btn-block" style="margin-bottom:8px;"><i class="fa-brands fa-google"></i> Google</button>
    <button class="btn btn-outline btn-block"><i class="fa-brands fa-apple"></i> Apple</button>
    <div class="auth-footer">Don't have an account? <a href="signup.html">Create one</a></div>
  </div>
</body>
</html>
